# Lint for the CPLD supervisor RTL.
#
# Runs on pull requests and on pushes to main.
#
# Lint only. The testbench uses clocking blocks and ##() cycle delays:
# Icarus 12.0 does not support clocking blocks, and Verilator 5.020 takes an
# internal fault on ##() inside an automatic task. ModelSim handles both, so
# `make -C sim sim` is a local step and is deliberately not run here.

name: RTL

# push is restricted to main; with a wildcard branch filter both triggers fire
# on a pull request branch and the same commit is built twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: RTL lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator

      - name: Report tool version
        run: verilator --version

      # Each module is linted as its own top. Port width mismatches between
      # modules are not caught until pmic_top exists to elaborate them
      # together.
      - name: Lint the RTL
        run: make -C sim lint